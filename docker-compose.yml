version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: acr_mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - acr_network

  redis:
    image: redis:7-alpine
    container_name: acr_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - acr_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acr_backend
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password@mongodb:27017/ai-code-reviewer?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_secret_key_change_in_production
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - mongodb
      - redis
    networks:
      - acr_network
    volumes:
      - ./backend/src:/app/src

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: acr_ml_service
    ports:
      - '8000:8000'
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - backend
    networks:
      - acr_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acr_frontend
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_ML_SERVICE_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - acr_network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  mongodb_data:
  redis_data:

networks:
  acr_network:
    driver: bridge
